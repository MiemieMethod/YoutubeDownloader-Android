name: main

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Restore FFmpeg from cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg/out
          key: ffmpeg-${{ hashFiles('ffmpeg/build.sh', 'ffmpeg/patches/**') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: ffmpeg/build.sh

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Publish app
        id: publish
        env:
          # APK signing key (see README). Until these secrets are configured, builds of a private
          # repository generate a new key and upload it as the "signing-secrets" artifact.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail

          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          args=()

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Releases are versioned after their tag
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]{1,2})(\.([0-9]{1,2}))?$ ]]; then
              echo "::error::Release tags must look like v1.2.3 (with minor and patch versions below 100)."
              exit 1
            fi

            args+=(-p:Version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[4]:-0}")

            if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
              echo "::error::Releases must be signed with your own key. Configure the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets first (see README)."
              exit 1
            fi
          fi

          # Artifacts of public repositories can be downloaded by anyone,
          # so a new key is only handed out in private repositories.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] && [ "$IS_PRIVATE_REPOSITORY" = "true" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Signing secrets are not configured, generating a new signing key..."

            ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
            # PKCS12 keystores use the same password for the store and the key
            ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            ANDROID_KEY_ALIAS="youtubedownloader"
            export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS

            keytool -genkeypair -noprompt \
              -keystore "$keystore" \
              -storetype PKCS12 \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=${GITHUB_REPOSITORY#*/}, O=$GITHUB_REPOSITORY_OWNER"

            ANDROID_KEYSTORE_BASE64="$(base64 -w 0 "$keystore")"
            export ANDROID_KEYSTORE_BASE64

            fingerprint="$(
              keytool -list -v -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" |
                sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p'
            )"
            echo "Generated a signing key with certificate SHA-256 fingerprint $fingerprint"

            secrets="$RUNNER_TEMP/signing-secrets"
            mkdir -p "$secrets"
            for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              printf '%s' "${!name}" > "$secrets/$name.txt"
            done
            cp "$keystore" "$secrets/release.keystore"

            settings_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/settings/secrets/actions"
            cat > "$secrets/README.txt" <<EOF
          APK 签名密钥 / APK signing key
          ==============================

          这是 GitHub Actions 为本仓库生成的 APK 签名密钥，本次运行构建的 APK 已经用它签名。
          请按以下步骤把它保存为仓库的 Secrets（只需做一次）：

          1. 打开 $settings_url
          2. 点击 "New repository secret"，添加下面 4 个 Secret：
             Name 填文件名（不含 .txt），Secret 填该文件的全部内容。
               ANDROID_KEYSTORE_BASE64    <- ANDROID_KEYSTORE_BASE64.txt
               ANDROID_KEYSTORE_PASSWORD  <- ANDROID_KEYSTORE_PASSWORD.txt
               ANDROID_KEY_ALIAS          <- ANDROID_KEY_ALIAS.txt
               ANDROID_KEY_PASSWORD       <- ANDROID_KEY_PASSWORD.txt
          3. 把这些文件私下备份到安全的地方，然后删除这个 Artifact（或整个运行记录）。
             丢失密钥：以后发布的新版本将无法覆盖安装旧版本；
             泄露密钥：别人可以冒充你发布能覆盖安装的"更新"。
          4. 之后所有的构建和 Release 都会使用这套 Secrets 签名，可以直接覆盖安装。

          注意：配置 Secrets 之前，每次构建都会生成一个新的密钥。只保存其中一份，
          并使用同一次运行构建出的 APK。

          ----------------------------------------------------------------------

          This signing key was generated by GitHub Actions for this repository.
          The APK built in the same run is already signed with it.

          1. Open $settings_url
          2. Click "New repository secret" and add 4 secrets. Use each file name
             (without .txt) as the name and the file's entire content as the value.
          3. Back up these files privately, then delete this artifact (or the whole run).
             If the key is lost, new versions can no longer be installed over old ones.
             If the key leaks, others can publish fake "updates" for your app.
          4. All later builds and releases are signed with these secrets.

          Until the secrets are configured, every build generates a different key.
          Keep only one of them, together with the APK built in the same run.

          Certificate SHA-256 fingerprint:
          $fingerprint
          EOF

            echo "signing-key-generated=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # Ignore line breaks and spaces that may sneak in when copying the secrets
            if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore" 2> /dev/null; then
              echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not valid Base64."
              exit 1
            fi

            ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS//[$'\r\n']/}"
            ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD//[$'\r\n']/}"
            ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD//[$'\r\n']/}"
            ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            export ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD

            if ! keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null; then
              echo "::error::Failed to open the signing key. Check the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets."
              exit 1
            fi

            args+=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$keystore"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
              -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
            )
          else
            echo "::warning::Signing secrets are not configured, so the APK is signed with a temporary debug key (see README)."
          fi

          dotnet publish YoutubeDownloader/YoutubeDownloader.csproj \
            -f net10.0-android \
            -c Release \
            -o publish \
            "${args[@]}"

          mkdir -p artifacts
          cp publish/*-Signed.apk artifacts/YoutubeDownloader.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeDownloader
          path: artifacts/YoutubeDownloader.apk
          if-no-files-found: error

      - name: Upload generated signing secrets
        if: ${{ steps.publish.outputs.signing-key-generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: signing-secrets
          path: ${{ runner.temp }}/signing-secrets/
          if-no-files-found: error
          # Contains the private signing key, so it should not be kept around for long
          retention-days: 1

  release:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          name: YoutubeDownloader

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Releases created on GitHub's website already exist (along with their tag)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" YoutubeDownloader.apk --clobber
          else
            gh release create "$TAG" YoutubeDownloader.apk --title "$TAG" --generate-notes --verify-tag
          fi
